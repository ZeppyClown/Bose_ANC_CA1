<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CA1 — Presenter layout</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#070b12;color:#b6c2d6;font-family:Arial,sans-serif}body{display:grid;grid-template-columns:minmax(0,1fr) 260px}iframe{width:100%;height:100%;border:0}aside{padding:20px;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;border-left:1px solid #263140}figure{order:5;margin:0;aspect-ratio:9/16;display:grid;place-items:center;border:1px dashed #64748b;color:#b6c2d6;font-size:14px;text-align:center;line-height:1.5}p{font-size:13px;line-height:1.5;margin:0}a{color:#4dd0e1}body.clean aside p{display:none}body.clean aside{padding-bottom:40px}body.clean figure{order:5}button{font:inherit;background:#142031;color:#e9eef7;border:1px solid #64748b;padding:8px;cursor:pointer}body.clean button{opacity:0}body.clean button:focus,body.clean button:hover{opacity:1}@media(max-width:1100px){body{grid-template-columns:minmax(0,1fr) 200px}aside{padding:12px}}
</style></head>
<body><iframe src="index.html" title="CA1 presentation"></iframe><aside><figure>Portrait video area<br>Place your camera overlay here</figure><p>Use a 1920 × 1080 window. Click inside the slides to use the presentation keys. This frame reserves space; it does not record or access your camera.</p><p>For submission, use the required PowerPoint and your team’s own recording.</p><button type="button" onclick="document.body.classList.toggle('clean')">Show / hide guidance</button><p><a href="index.html">Open slides alone</a></p></aside></body></html>
